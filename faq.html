<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Do I pay anything to buy through AVAVA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. There is no search fee, no viewing fee and no buyer-side commission. You pay your notary and the transfer taxes, exactly as you would buying privately."
      }
    },
    {
      "@type": "Question",
      "name": "Can I see a property before making an offer?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Always. Viewings are arranged by the agent who signed the file, usually within 48 hours. If the property is let, the tenant has to agree a time first — that can add a few days."
      }
    },
    {
      "@type": "Question",
      "name": "What is in a verified file?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The deed, the current permits, the price history since 2011, and a measured floor plan drawn by our surveyor. If any of the four is missing the listing does not go live."
      }
    },
    {
      "@type": "Question",
      "name": "Can I buy off-plan safely?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "New developments show the construction stage, the delivery quarter and the payment schedule. Deposits sit in escrow until the stage they were paid for is signed off — never with the developer directly."
      }
    },
    {
      "@type": "Question",
      "name": "Do you help with the mortgage?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We do not lend or broker. We publish what banks are quoting each month and a calculator that uses those rates, so you can check what a property costs before you enquire."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take to list?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "About ten minutes of your time. Upload the deed and any plans, answer six questions, and we verify the file within two working days. Photography and the floor plan are arranged in that window."
      }
    },
    {
      "@type": "Question",
      "name": "What does it cost to sell?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "1.4% of the signed price, charged once, on completion. Listing, photography, the survey and featured placement are all included. If it does not sell you pay nothing."
      }
    },
    {
      "@type": "Question",
      "name": "Can I sell without an agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The free plan gives you a verified, published file and you handle viewings yourself. You can switch to an agent at any point — the file stays as it is."
      }
    },
    {
      "@type": "Question",
      "name": "How is the asking price set?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We show you what comparable properties actually signed for, not what they asked. You set the price; if it sits more than 12% above the comparables we say so before it goes live."
      }
    },
    {
      "@type": "Question",
      "name": "Can I take the listing down?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "At any time, with no notice period and no exit fee. The file is archived, not deleted — if you relist within a year the verification still stands."
      }
    },
    {
      "@type": "Question",
      "name": "Who holds the deposit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An escrow account, not the landlord and not us. It is released when both sides sign off the inventory at the end of the tenancy, or by an adjudicator if they disagree."
      }
    },
    {
      "@type": "Question",
      "name": "Are the service charges included in the rent shown?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Managed buildings publish the service charge separately, and it is stated on the file before you enquire. Where it is not yet known the listing says so rather than guessing."
      }
    },
    {
      "@type": "Question",
      "name": "How long are the leases?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Long lets run twelve months minimum, most renew annually. Short lets need a tourism licence, which we check against the municipal register — six districts lost theirs in July."
      }
    },
    {
      "@type": "Question",
      "name": "What exactly do you check?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Four things: that the deed matches the seller, that the permits are current, that the price history is complete, and that the floor area was measured rather than estimated. All four, or no listing."
      }
    },
    {
      "@type": "Question",
      "name": "How many files are refused?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "1 862 so far this year. Most fail on permits — an extension built without one, or a licence that lapsed. We tell the owner what is missing and re-check for free once it is fixed."
      }
    },
    {
      "@type": "Question",
      "name": "Who measures the floor area?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A licensed surveyor, on site, to the local standard. Advertised areas are wrong by 4% on average across the market; the measured figure is the one on our files."
      }
    },
    {
      "@type": "Question",
      "name": "Does verification expire?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "After twelve months a file is re-checked before it can stay live. Permits change, and a plan drawn two years ago is not evidence of anything today."
      }
    },
    {
      "@type": "Question",
      "name": "When is commission due?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On the day the deed is signed, deducted from the completion funds. Nothing is invoiced before that."
      }
    },
    {
      "@type": "Question",
      "name": "Is VAT on top?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The 1.4% is quoted excluding VAT, added at the local rate. The rate for your country is shown before you sign anything."
      }
    },
    {
      "@type": "Question",
      "name": "Can I pay in a currency other than euro?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Prices display in EUR, USD or GBP throughout the site at the day's rate, but contracts and payments are in the local currency of the property."
      }
    },
    {
      "@type": "Question",
      "name": "What if the buyer pulls out?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No commission is due — it is only earned on a signed deed. Any deposit held in escrow is dealt with under the reservation contract, which we will read through with you."
      }
    },
    {
      "@type": "Question",
      "name": "How do I become an AVAVA agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Apply with your national licence number, three closed files and one client reference. We check the licence against the register and review within ten working days."
      }
    },
    {
      "@type": "Question",
      "name": "Are the agent figures real?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes — deals closed, years on the register, reply time and the gap between asking and signed price all come from completed transactions on the index. None of it is self-reported."
      }
    },
    {
      "@type": "Question",
      "name": "Can an agent list a property I already have elsewhere?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only once your existing mandate has expired or been released. We will read the contract with you and say plainly what it allows."
      }
    },
    {
      "@type": "Question",
      "name": "What does an agency subscription include?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "€240 a month for unlimited files, a branded agency page, enquiry routing and 24-hour verification. Commission stays at 1.4% — the subscription does not buy a better ranking."
      }
    }
  ]
}
</script>

          <span class="fhist__bar" data-h="12"></span><span class="fhist__bar" data-h="18"></span><span class="fhist__bar" data-h="26"></span><span class="fhist__bar" data-h="34"></span><span class="fhist__bar" data-h="46"></span><span class="fhist__bar" data-h="58"></span><span class="fhist__bar" data-h="72"></span><span class="fhist__bar" data-h="88"></span><span class="fhist__bar" data-h="96"></span><span class="fhist__bar" data-h="84"></span><span class="fhist__bar" data-h="66"></span><span class="fhist__bar" data-h="52"></span><span class="fhist__bar" data-h="38"></span><span class="fhist__bar" data-h="30"></span><span class="fhist__bar" data-h="26"></span><span class="fhist__bar" data-h="18"></span><span class="fhist__bar" data-h="12"></span>
        </span>
        <span class="fhist__axis" aria-hidden="true"><span class="fhist__span" data-fhist-span></span></span>
        <p class="fhist__ends">
          <span data-fprice-floor>€90 k</span>
          <span class="fhist__median" data-fprice-median>median €680 k</span>
          <span data-fprice-ceil>€4.8 M</span>
        </p>
        <div class="fbands" role="group" aria-label="Price band">
          <input class="sr-only fband__input" type="radio" name="fband" id="fb-0" value="0">
          <label class="fband" for="fb-0"><span>Any price</span><span class="fband__bar"><span class="fband__fill fband__fill--100"></span></span><span class="fband__count">24 128</span></label>
          <input class="sr-only fband__input" type="radio" name="fband" id="fb-1" value="1" checked>
          <label class="fband" for="fb-1"><span>Up to €300 k</span><span class="fband__bar"><span class="fband__fill fband__fill--38"></span></span><span class="fband__count">4 118</span></label>
          <input class="sr-only fband__input" type="radio" name="fband" id="fb-2" value="2">
          <label class="fband" for="fb-2"><span>€300 k — €700 k</span><span class="fband__bar"><span class="fband__fill fband__fill--72"></span></span><span class="fband__count">8 940</span></label>
          <input class="sr-only fband__input" type="radio" name="fband" id="fb-3" value="3">
          <label class="fband" for="fb-3"><span>€700 k — €1.5 M</span><span class="fband__bar"><span class="fband__fill fband__fill--54"></span></span><span class="fband__count">6 512</span></label>
          <input class="sr-only fband__input" type="radio" name="fband" id="fb-4" value="4">
          <label class="fband" for="fb-4"><span>€1.5 M +</span><span class="fband__bar"><span class="fband__fill fband__fill--26"></span></span><span class="fband__count">2 264</span></label>
        </div>
      </section>

      <section class="fcol" aria-labelledby="fcol-rooms">
        <p class="fcol__head"><span id="fcol-rooms">Rooms &amp; size</span><span class="fcol__num">03</span></p>

        <div class="fcount">
          <p class="fcount__label">Bedrooms</p>
          <div class="fcount__row" role="group" aria-label="Bedrooms">
            <input class="sr-only fcount__input" type="radio" name="fbeds" id="fbe-any" checked><label class="fcount__btn" for="fbe-any">Any</label>
            <input class="sr-only fcount__input" type="radio" name="fbeds" id="fbe-1"><label class="fcount__btn" for="fbe-1">1+</label>
            <input class="sr-only fcount__input" type="radio" name="fbeds" id="fbe-2"><label class="fcount__btn" for="fbe-2">2+</label>
            <input class="sr-only fcount__input" type="radio" name="fbeds" id="fbe-3"><label class="fcount__btn" for="fbe-3">3+</label>
            <input class="sr-only fcount__input" type="radio" name="fbeds" id="fbe-4"><label class="fcount__btn" for="fbe-4">4+</label>
          </div>
        </div>

        <div class="fcount">
          <p class="fcount__label">Bathrooms</p>
          <div class="fcount__row" role="group" aria-label="Bathrooms">
            <input class="sr-only fcount__input" type="radio" name="fbaths" id="fba-any" checked><label class="fcount__btn" for="fba-any">Any</label>
            <input class="sr-only fcount__input" type="radio" name="fbaths" id="fba-1"><label class="fcount__btn" for="fba-1">1+</label>
            <input class="sr-only fcount__input" type="radio" name="fbaths" id="fba-2"><label class="fcount__btn" for="fba-2">2+</label>
            <input class="sr-only fcount__input" type="radio" name="fbaths" id="fba-3"><label class="fcount__btn" for="fba-3">3+</label>
          </div>
        </div>

        <div class="fcount">
          <p class="fcount__label">Parking</p>
          <div class="fcount__row" role="group" aria-label="Parking">
            <input class="sr-only fcount__input" type="radio" name="fpark" id="fp-any" checked><label class="fcount__btn" for="fp-any">Any</label>
            <input class="sr-only fcount__input" type="radio" name="fpark" id="fp-1"><label class="fcount__btn" for="fp-1">1+</label>
            <input class="sr-only fcount__input" type="radio" name="fpark" id="fp-2"><label class="fcount__btn" for="fp-2">2+</label>
          </div>
        </div>

        <div class="fsizes">
          <p class="field field--line">
            <label class="field__label" for="f-minm">Min m²</label>
            <input class="field__control" type="text" id="f-minm" inputmode="numeric" placeholder="60">
          </p>
          <p class="field field--line">
            <label class="field__label" for="f-maxm">Max m²</label>
            <input class="field__control" type="text" id="f-maxm" inputmode="numeric" placeholder="240">
          </p>
        </div>
      </section>

      <section class="fcol" aria-labelledby="fcol-must">
        <p class="fcol__head"><span id="fcol-must">Must have</span><span class="fcol__num">04</span></p>
        <div class="fcol__chips">
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="terrace" checked><span>Terrace</span></label>
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="parking"><span>Parking</span></label>
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="lift"><span>Lift</span></label>
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="garden"><span>Garden</span></label>
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="pool"><span>Pool</span></label>
          <label class="fchip"><input type="checkbox" class="sr-only fchip__input" name="ffeat" value="sea"><span>Sea view</span></label>
        </div>
        <p class="field field--line fcol__field">
          <label class="field__label" for="f-cond">Condition</label>
          <select class="field__control" id="f-cond">
            <option>Any condition</option><option>New / never lived in</option><option>Renovated</option><option>Needs work</option>
          </select>
        </p>
        <p class="field field--line fcol__field">
          <label class="field__label" for="f-year">Year built</label>
          <select class="field__control" id="f-year">
            <option>Any year</option><option>2020 and newer</option><option>2000 — 2019</option><option>Before 2000</option><option>Listed / heritage</option>
          </select>
        </p>
      </section>
    </div>

    <div class="fsheet__foot">
      <button class="fsheet__reset" type="button" data-filters-reset>Reset all</button>
      <p class="fsheet__note" data-filters-delta>Filters apply to the visible index</p>
      <button class="btn btn--accent" type="button" data-filters-apply>Show <span data-filters-count>33</span> files</button>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>


</html>
